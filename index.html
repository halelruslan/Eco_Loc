<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoLoc Алматы</title>
<meta name="description" content="Сортировка отходов в Алматы: карта баков, AI-сортировщик и эко-калькулятор">
<meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#047857" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EcoLoc">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg: #f0fdf4;
  --surface: #ffffff;
  --primary: #059669;
  --primary-dark: #047857;
  --secondary: #0ea5e9;
  --accent: #f59e0b;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(0,0,0,.06);
  --radius: 16px;
  --danger: #ef4444;
  --header-bg: rgba(255,255,255,.88);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: #334155;
  --shadow: 0 10px 25px -5px rgba(0,0,0,.4);
  --header-bg: rgba(30,41,59,.88);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { background: var(--bg); color: var(--text); line-height: 1.6; transition: background .3s, color .3s; }

header { position: sticky; top: 0; z-index: 1200; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.nav-container { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 1.2rem; }
.logo { font-size: 1.35rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: .5rem; white-space: nowrap; }
.nav-items { display: flex; gap: 1.1rem; list-style: none; align-items: center; min-width: 0; }
.nav-items a { text-decoration: none; color: var(--text); font-weight: 600; font-size: .88rem; transition: color .2s; white-space: nowrap; }
.nav-items a:hover { color: var(--primary); }
.nav-links { display: flex; gap: 1.1rem; align-items: center; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-tools { display: flex; gap: .5rem; align-items: center; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; cursor: pointer; color: var(--text); padding: .35rem .6rem; font-weight: 700; }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.lang-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.lang-toggle button { background: none; border: none; color: var(--text); padding: .35rem .65rem; font-weight: 700; font-size: .82rem; cursor: pointer; }
.lang-toggle button[aria-pressed="true"] { background: var(--primary); color: #fff; }
@media (max-width: 860px) {
  .nav-container { flex-wrap: wrap; }
  .nav-items { order: 3; width: 100%; }
  .nav-links { width: 100%; }
}

.container { max-width: 1280px; margin: 1.5rem auto; padding: 0 1.2rem; }
.hero { background: linear-gradient(135deg, rgba(5,150,105,.14), rgba(14,165,233,.12)); border-radius: var(--radius); padding: 2rem; margin-bottom: 2rem; border: 1px solid var(--border); }
.hero h1 { font-size: 1.9rem; line-height: 1.25; margin-bottom: .7rem; color: var(--primary); text-wrap: balance; }
.hero p { color: var(--text-muted); font-size: 1.05rem; max-width: 880px; }
.hero-actions { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 1.3rem; }
.hero-actions .btn { width: auto; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; min-width: 0; }
.card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: .8rem; display: flex; align-items: center; gap: .6rem; color: var(--primary); }
.muted { color: var(--text-muted); font-size: .95rem; }
.lead { color: var(--text-muted); font-size: .95rem; margin-bottom: 1.1rem; }

.problem-card { background: linear-gradient(135deg, rgba(239,68,68,.08), rgba(245,158,11,.08)), var(--surface); border-left: 4px solid var(--danger); }
.solution-card { background: linear-gradient(135deg, rgba(5,150,105,.08), rgba(14,165,233,.08)), var(--surface); border-left: 4px solid var(--primary); }
.tip-item { display: flex; gap: .8rem; margin-bottom: .8rem; padding: .8rem; background: var(--bg); border-radius: 10px; }
.tip-icon { font-size: 1.2rem; color: var(--primary); min-width: 28px; text-align: center; }

.btn { background: var(--primary); color: #fff; border: none; padding: .75rem 1.3rem; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; display: inline-flex; justify-content: center; align-items: center; gap: .5rem; transition: background .2s; font-size: .95rem; text-decoration: none; }
.btn:hover { background: var(--primary-dark); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-secondary { background: var(--secondary); }
.btn-secondary:hover { background: #0284c7; }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary); color: #fff; }
.btn-sm { padding: .4rem .8rem; font-size: .8rem; width: auto; }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.badge { background: rgba(5,150,105,.15); color: var(--primary); padding: .2rem .7rem; border-radius: 20px; font-size: .72rem; font-weight: 700; }

.form-control { width: 100%; padding: .7rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: .9rem; outline: none; font-size: .95rem; }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5,150,105,.15); }

/* AI */
.scanner-box { border: 2px dashed var(--border); border-radius: 12px; padding: 1.8rem; text-align: center; cursor: pointer; background: rgba(5,150,105,.04); transition: all .2s; }
.scanner-box:hover { border-color: var(--primary); background: rgba(5,150,105,.08); }
#imagePreview { max-width: 100%; max-height: 220px; border-radius: 10px; margin-top: 1rem; display: none; }
.ai-result { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 10px; background: rgba(14,165,233,.1); border-left: 4px solid var(--secondary); display: none; }
.ai-result.show { display: block; }
.loading { color: var(--text-muted); font-style: italic; text-align: center; margin-top: 1rem; }

/* MAP */
.toolbar { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: .9rem; }
.toolbar .btn { width: auto; }
.status { margin-bottom: .9rem; padding: .7rem 1rem; border-radius: 10px; font-size: .9rem; display: none; }
.status.show { display: block; }
.status.info { background: rgba(14,165,233,.12); border-left: 4px solid var(--secondary); }
.status.ok { background: rgba(5,150,105,.12); border-left: 4px solid var(--primary); }
.status.err { background: rgba(239,68,68,.12); border-left: 4px solid var(--danger); }
.status.warn { background: rgba(245,158,11,.14); border-left: 4px solid var(--accent); }
#map { position: relative; z-index: 0; height: 540px; width: 100%; border-radius: 12px; border: 1px solid var(--border); }
@media (max-width: 600px) { #map { height: 420px; } }
.leaflet-popup-content { font-size: .88rem; line-height: 1.45; }
.pop strong { display: block; margin-bottom: .2rem; }
.pop-type { display: inline-block; background: var(--c); color: #fff; font-size: .72rem; font-weight: 700; padding: .1rem .55rem; border-radius: 20px; margin-bottom: .3rem; }
.pop-d { color: #64748b; margin-bottom: .4rem; }
.pop a { color: #047857; font-weight: 700; text-decoration: none; }
.pop small { display: block; color: #94a3b8; margin-top: .3rem; }

/* PINS */
.bin-icon { background: none !important; border: none !important; }
.pin { display: block; width: var(--s); height: var(--s); filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); flex: none; }
.pin-in { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: var(--c); color: #fff; font-size: calc(var(--s) * .46); border: 2px solid #fff; }
.pin-circle .pin-in { border-radius: 50%; }
.pin-square .pin-in { border-radius: 24%; }
.pin-diamond .pin-in { transform: rotate(45deg); border-radius: 18%; }
.pin-diamond .pin-in i { transform: rotate(-45deg); }
.pin-hex .pin-in { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); border: none; }
.pin-tri .pin-in { clip-path: polygon(50% 3%, 99% 95%, 1% 95%); border: none; align-items: flex-end; padding-bottom: 17%; }
.me-pin { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(37,99,235,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 16px rgba(37,99,235,0); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
@media (prefers-reduced-motion: reduce) { .me-pin { animation: none; } html { scroll-behavior: auto; } }

/* LEGEND */
.legend-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; margin: 1.1rem 0 .6rem; }
.legend-head h3 { font-size: 1rem; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .6rem; }
.legend-item { display: flex; align-items: center; gap: .8rem; text-align: left; padding: .6rem .8rem; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; transition: opacity .2s, border-color .2s; min-width: 0; }
.legend-item:hover { border-color: var(--primary); }
.legend-item[aria-pressed="false"] { opacity: .4; }
.legend-item .pin-wrap { width: 44px; display: flex; justify-content: center; flex: none; }
.legend-item span.txt { flex: 1; min-width: 0; font-size: .85rem; line-height: 1.35; }
.legend-item b { display: block; font-size: .9rem; }
.legend-item small { color: var(--text-muted); }
.legend-item em { font-style: normal; font-weight: 800; color: var(--primary); }
.demo-note { margin-top: 1rem; font-size: .82rem; color: var(--text-muted); }

/* LISTS */
.near-list, .full-list { display: grid; gap: .6rem; }
.item { display: flex; align-items: center; gap: .8rem; padding: .7rem .9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
.item .rank { font-weight: 800; color: var(--primary); width: 1.6rem; text-align: center; flex: none; }
.item .pin-wrap { width: 44px; display: flex; justify-content: center; flex: none; }
.item .info { flex: 1; min-width: 0; }
.item .info b { display: block; font-size: .93rem; overflow-wrap: anywhere; }
.item .info small { color: var(--text-muted); }
.item .dist { font-weight: 800; color: var(--secondary); white-space: nowrap; }
.item .acts { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .item { flex-wrap: wrap; } .item .acts { width: 100%; justify-content: flex-start; } }
.dist-title { margin: 1.1rem 0 .5rem; font-size: 1rem; color: var(--primary); display: flex; gap: .5rem; align-items: baseline; }
.dist-title small { color: var(--text-muted); font-weight: 500; }
.list-controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: .7rem; margin-bottom: .4rem; }
@media (max-width: 700px) { .list-controls { grid-template-columns: 1fr; } }
.list-controls .form-control { margin-bottom: 0; }
.count-line { font-size: .85rem; color: var(--text-muted); margin: .4rem 0 .2rem; }

/* CALC */
.calc-group { margin-bottom: 1.1rem; }
.calc-group label { display: block; font-weight: 600; margin-bottom: .4rem; font-size: .9rem; }
.calc-group input[type="range"] { width: 100%; accent-color: var(--primary); }
.calc-result-box { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 1.4rem; border-radius: 12px; text-align: center; margin-top: 1rem; }
.calc-result-number { font-size: 2.1rem; font-weight: 800; }

/* QUIZ */
.quiz-option { display: block; width: 100%; text-align: left; padding: .8rem 1rem; margin-bottom: .6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer; transition: all .2s; font-size: .95rem; }
.quiz-option:hover:not(:disabled) { border-color: var(--primary); background: rgba(5,150,105,.06); }
.quiz-option.correct { border-color: var(--primary); background: rgba(5,150,105,.18); }
.quiz-option.wrong { border-color: var(--danger); background: rgba(239,68,68,.12); }
.quiz-option:disabled { cursor: default; }
.quiz-q { display: block; margin-bottom: .8rem; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-top: 1rem; }
.stat-box { text-align: center; padding: 1rem; background: var(--bg); border-radius: 12px; }
.stat-number { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
.stat-label { font-size: .8rem; color: var(--text-muted); }

.success-msg { color: var(--primary); font-weight: 600; margin-top: .8rem; }
footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: .9rem; border-top: 1px solid var(--border); margin-top: 2rem; }
.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="logo"><i class="fa-solid fa-leaf"></i> EcoLoc <span class="badge" data-i18n="badge"></span></div>
    <ul class="nav-items">
      <li class="nav-links">
        <a href="#problems" data-i18n="navProblems"></a>
        <a href="#map-section" data-i18n="navMap"></a>
        <a href="#nearby-section" data-i18n="navNearby"></a>
        <a href="#list-section" data-i18n="navList"></a>
        <a href="#ai-scanner" data-i18n="navAI"></a>
        <a href="#calc-section" data-i18n="navCalc"></a>
        <a href="#quiz-section" data-i18n="navQuiz"></a>
        <a href="#report-section" data-i18n="navReport"></a>
      </li>
      <li class="nav-tools">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" id="langRu" aria-pressed="true">RU</button>
          <button type="button" id="langKk" aria-pressed="false">KZ</button>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme"><i class="fa-solid fa-moon"></i></button>
      </li>
    </ul>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n-html="heroText"></p>
    <div class="hero-actions">
      <button class="btn" id="heroLocate" type="button"><i class="fa-solid fa-location-crosshairs"></i> <span data-i18n="heroBtnNear"></span></button>
      <a class="btn btn-outline" href="#map-section"><i class="fa-solid fa-map"></i> <span data-i18n="heroBtnMap"></span></a>
    </div>
  </section>

  <section id="problems">
    <div class="grid-2">
      <div class="card problem-card">
        <div class="card-title"><i class="fa-solid fa-triangle-exclamation"></i> <span data-i18n="probTitle"></span></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-circle-question"></i></div><div><strong data-i18n="p1t"></strong><br><span data-i18n="p1d"></span></div></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-circle-question"></i></div><div><strong data-i18n="p2t"></strong><br><span data-i18n="p2d"></span></div></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-circle-question"></i></div><div><strong data-i18n="p3t"></strong><br><span data-i18n="p3d"></span></div></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-circle-question"></i></div><div><strong data-i18n="p4t"></strong><br><span data-i18n="p4d"></span></div></div>
      </div>
      <div class="card solution-card">
        <div class="card-title"><i class="fa-solid fa-lightbulb"></i> <span data-i18n="solTitle"></span></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-map-location-dot"></i></div><div><strong data-i18n="s1t"></strong><br><span data-i18n="s1d"></span></div></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-location-crosshairs"></i></div><div><strong data-i18n="s2t"></strong><br><span data-i18n="s2d"></span></div></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-robot"></i></div><div><strong data-i18n="s3t"></strong><br><span data-i18n="s3d"></span></div></div>
        <div class="tip-item"><div class="tip-icon"><i class="fa-solid fa-people-group"></i></div><div><strong data-i18n="s4t"></strong><br><span data-i18n="s4d"></span></div></div>
      </div>
    </div>
  </section>

  <!-- MAP -->
  <section class="card" id="map-section">
    <div class="card-title"><i class="fa-solid fa-map-location-dot"></i> <span data-i18n="mapTitle"></span></div>
    <p class="lead" data-i18n="mapLead"></p>
    <div class="toolbar">
      <button class="btn" id="locateBtn" type="button"><i class="fa-solid fa-location-crosshairs"></i> <span data-i18n="whereAmI"></span></button>
      <button class="btn btn-outline" id="pickBtn" type="button"><i class="fa-solid fa-hand-pointer"></i> <span data-i18n="pickBtn"></span></button>
      <button class="btn btn-outline" id="fitBtn" type="button"><i class="fa-solid fa-expand"></i> <span data-i18n="wholeCity"></span></button>
    </div>
    <div id="geoStatus" class="status" role="status"></div>
    <div id="map"></div>

    <div class="legend-head">
      <h3 data-i18n="legendTitle"></h3>
      <button class="btn btn-outline btn-sm" id="showAllBtn" type="button" data-i18n="showAll"></button>
    </div>
    <div class="legend" id="legend"></div>
    <p class="demo-note" data-i18n="demoNote"></p>
  </section>

  <!-- NEARBY -->
  <section class="card" id="nearby-section">
    <div class="card-title"><i class="fa-solid fa-route"></i> <span data-i18n="nearTitle"></span></div>
    <div id="nearList" class="near-list"></div>
  </section>

  <!-- FULL LIST -->
  <section class="card" id="list-section">
    <div class="card-title"><i class="fa-solid fa-list-ul"></i> <span data-i18n="listTitle"></span></div>
    <p class="lead" data-i18n="listLead"></p>
    <div class="list-controls">
      <input type="search" class="form-control" id="listSearch" data-i18n-ph="searchPh">
      <select class="form-control" id="listDistrict"></select>
      <select class="form-control" id="listSort"></select>
    </div>
    <div class="count-line" id="listCount"></div>
    <div id="fullList"></div>
  </section>

  <!-- AI -->
  <section class="card" id="ai-scanner">
    <div class="card-title"><i class="fa-solid fa-robot"></i> <span data-i18n="aiTitle"></span></div>
    <p class="lead" data-i18n="aiLead"></p>
    <div class="scanner-box" id="dropZone" role="button" tabindex="0">
      <i class="fa-solid fa-cloud-arrow-up" style="font-size:2.8rem;color:var(--primary)"></i>
      <p style="margin-top:.6rem;font-weight:600" data-i18n="aiDrop"></p>
      <p class="muted" style="font-size:.85rem;margin-top:.3rem" data-i18n="aiFormats"></p>
      <input type="file" id="imageUpload" accept="image/*" class="hidden">
    </div>
    <img id="imagePreview" alt="">
    <div id="aiResult" class="ai-result"></div>
    <div id="aiLoading" class="loading hidden"></div>
  </section>

  <!-- CALC -->
  <section class="card" id="calc-section">
    <div class="card-title"><i class="fa-solid fa-calculator"></i> <span data-i18n="calcTitle"></span></div>
    <p class="lead" data-i18n="calcLead"></p>
    <div class="calc-group"><label for="plastic"><span data-i18n="calcQ1"></span> <b id="plasticVal">5</b></label><input type="range" id="plastic" min="0" max="30" value="5"></div>
    <div class="calc-group"><label for="sort"><span data-i18n="calcQ2"></span> <b id="sortVal">1</b></label><input type="range" id="sort" min="0" max="7" value="1"></div>
    <div class="calc-group"><label for="paper"><span data-i18n="calcQ3"></span> <b id="paperVal">2</b></label><input type="range" id="paper" min="0" max="20" value="2"></div>
    <div class="calc-group"><label for="transport"><span data-i18n="calcQ4"></span> <b id="transportVal"></b></label><input type="range" id="transport" min="0" max="2" value="1"></div>
    <div class="calc-result-box">
      <div data-i18n="calcRes"></div>
      <div class="calc-result-number" id="co2Result"></div>
      <div style="font-size:.95rem;opacity:.9" id="wasteResult"></div>

    { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', ref: null,
      attr: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', native: 19 }
  ];
}
function applyTiles() {
  const dark = htmlEl.getAttribute('data-theme') === 'dark';
  const pr = tileProviders(dark)[providerIdx];
  if (tileLayerObj) map.removeLayer(tileLayerObj);
  if (refLayerObj) { map.removeLayer(refLayerObj); refLayerObj = null; }
  tileOk = 0; tileErr = 0;
  tileLayerObj = L.tileLayer(pr.url, { maxZoom: 19, maxNativeZoom: pr.native, attribution: pr.attr });
  tileLayerObj.on('tileload', () => { tileOk++; });
  tileLayerObj.on('tileerror', () => {
    tileErr++;
    if (tileOk === 0 && tileErr >= 4 && providerIdx < 1) { providerIdx++; applyTiles(); }
  });
  tileLayerObj.addTo(map);
  if (pr.ref) refLayerObj = L.tileLayer(pr.ref, { maxZoom: 19, maxNativeZoom: pr.native }).addTo(map);
}
applyTiles();

/* ================= GEOLOCATION / NEAREST ================= */
let userPos = null, userMarker = null, userCircle = null, nearLine = null;

function hav(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (c - a) * r, dLng = (d - b) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmtDist(m) {
  if (m < 1000) return Math.round(m / 10) * 10 + (lang === 'kk' ? ' м' : ' м');
  return (m / 1000).toFixed(1).replace('.', ',') + (lang === 'kk' ? ' км' : ' км');
}
function setStatus(key, kind) {
  const el = $('geoStatus');
  if (!key) { el.className = 'status'; el.textContent = ''; el.dataset.key = ''; return; }
  el.dataset.key = key; el.dataset.kind = kind;
  el.className = 'status show ' + kind;
  el.textContent = t(key);
}
function itemHTML(p, rank, d) {
  return '<div class="item">' +
    (rank ? '<div class="rank">' + rank + '</div>' : '') +
    '<div class="pin-wrap">' + pinHTML(p.type) + '</div>' +
    '<div class="info"><b>' + esc(p[lang]) + '</b><small>' + esc(TYPES[p.type][lang].name) + ' · ' + esc(districtLabel(p.dist)) + '</small></div>' +
    (d != null ? '<div class="dist">' + fmtDist(d) + '</div>' : '') +
    '<div class="acts"><button type="button" class="btn btn-outline btn-sm" data-focus="' + p.i + '"><i class="fa-solid fa-location-dot"></i> ' + esc(t('onMap')) + '</button>' +
    '<a class="btn btn-sm" href="' + routeURL(p) + '" target="_blank" rel="noopener"><i class="fa-solid fa-route"></i> ' + esc(t('route')) + '</a></div></div>';
}
function renderNearest() {
  const box = $('nearList');
  if (!userPos) { box.innerHTML = '<p class="muted">' + esc(t('nearEmpty')) + '</p>'; return; }
  if (!active.size) { box.innerHTML = '<p class="muted">' + esc(t('noTypes')) + '</p>'; return; }
  const list = POINTS.filter(p => active.has(p.type))
    .map(p => ({ p, d: hav(userPos.lat, userPos.lng, p.lat, p.lng) }))
    .sort((a, b) => a.d - b.d).slice(0, 10);
  box.innerHTML = list.map((x, n) => itemHTML(x.p, n + 1, x.d)).join('');
}
function drawNearLine() {
  if (nearLine) { map.removeLayer(nearLine); nearLine = null; }
  if (!userPos || !active.size) return;
  const list = POINTS.filter(p => active.has(p.type))
    .map(p => ({ p, d: hav(userPos.lat, userPos.lng, p.lat, p.lng) })).sort((a, b) => a.d - b.d);
  if (!list.length) return;
  nearLine = L.polyline([[userPos.lat, userPos.lng], [list[0].p.lat, list[0].p.lng]], { color: '#2563eb', weight: 3, dashArray: '6 8' }).addTo(map);
}

let pickMode = false;
function enablePick() {
  pickMode = true;
  map.getContainer().style.cursor = 'crosshair';
}
function disablePick() {
  pickMode = false;
  map.getContainer().style.cursor = '';
}
map.on('click', e => {
  if (!pickMode) return;
  disablePick();
  setUserPosition(e.latlng.lat, e.latlng.lng, null, true);
});
$('pickBtn').addEventListener('click', () => {
  $('map-section').scrollIntoView({ behavior: 'smooth' });
  enablePick();
  setStatus('pickHint', 'info');
});

function setUserPosition(lat, lng, acc, manual) {
    userPos = { lat: lat, lng: lng, acc: acc };
    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);
    userMarker = L.marker([userPos.lat, userPos.lng], { icon: L.divIcon({ className: 'bin-icon', html: '<div class="me-pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 }).addTo(map);
    if (userPos.acc && userPos.acc < 3000) userCircle = L.circle([userPos.lat, userPos.lng], { radius: userPos.acc, color: '#2563eb', weight: 1, fillOpacity: .08 }).addTo(map);
    const far = hav(userPos.lat, userPos.lng, 43.2445, 76.9000) > 50000;
    setStatus(far ? 'geoFar' : (manual ? 'geoManualOk' : 'geoOk'), far ? 'warn' : 'ok');
    renderNearest(); renderList(); drawNearLine();
    const near = POINTS.filter(p => active.has(p.type))
      .map(p => ({ p, d: hav(userPos.lat, userPos.lng, p.lat, p.lng) })).sort((a, b) => a.d - b.d).slice(0, 3);
    if (!far && near.length) map.fitBounds([[userPos.lat, userPos.lng]].concat(near.map(x => [x.p.lat, x.p.lng])), { padding: [50, 50], maxZoom: 16 });
    else if (far) fitAll();
}

function locate() {
  if (!navigator.geolocation) { setStatus('geoUnsupported', 'err'); enablePick(); return; }
  if (window.isSecureContext === false && location.protocol !== 'file:') { setStatus('geoInsecure', 'err'); enablePick(); return; }
  setStatus('geoWaiting', 'info');
  $('locateBtn').disabled = true; $('heroLocate').disabled = true;
  let lowTried = false;
  const geoOk = pos => {
    $('locateBtn').disabled = false; $('heroLocate').disabled = false;
    disablePick();
    setUserPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, false);
  };
  const geoFail = err => {
    // PCs without GPS often time out in high-accuracy mode: retry once with network location
    if (!lowTried && err.code !== 1) {
      lowTried = true;
      navigator.geolocation.getCurrentPosition(geoOk, geoFail, { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 });
      return;
    }
    $('locateBtn').disabled = false; $('heroLocate').disabled = false;
    setStatus(err.code === 1 ? 'geoDenied' : err.code === 3 ? 'geoTimeout' : 'geoUnavailable', 'err');
    enablePick(); // manual fallback: the next click on the map sets the position
  };
  navigator.geolocation.getCurrentPosition(geoOk, geoFail, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
$('locateBtn').addEventListener('click', locate);
$('heroLocate').addEventListener('click', () => { $('map-section').scrollIntoView({ behavior: 'smooth' }); locate(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-focus]');
  if (b) focusPoint(+b.dataset.focus);
});

/* ================= AI SORTER ================= */
const GUIDE = {
  plastic: { color: '#0ea5e9', icon: 'fa-bottle-water', bins: ['s', 'r', 'z'] },
  paper:   { color: '#f59e0b', icon: 'fa-newspaper', bins: ['s', 'r', 'z'] },
  glass:   { color: '#8b5cf6', icon: 'fa-wine-bottle', bins: ['s', 'r', 'z'] },
  metal:   { color: '#64748b', icon: 'fa-screwdriver-wrench', bins: ['r', 's', 'z'] },
  organic: { color: '#16a34a', icon: 'fa-leaf', bins: ['y', 'z'] },
  special: { color: '#ef4444', icon: 'fa-battery-half', bins: ['h'] },
  other:   { color: '#475569', icon: 'fa-trash', bins: ['y', 'z', 'p'] }
};
// order matters: first matching category wins for each prediction
const CATS = [
  ['special', /cellular telephone|cell phone|mobile phone|notebook computer|laptop|\bipod\b|computer mouse|remote control|modem|keyboard|monitor|television|radio|joystick|hard disc|printer|projector|loudspeaker|power drill|flashlight|torch|lighter|microwave|digital clock|digital watch|stopwatch|dial telephone|pay-phone|hand-held computer|cassette|tape player|reflex camera|\bcd player|iron\b|electric/i],
  ['glass', /wine bottle|beer bottle|beer glass|red wine|wine glass|goblet|vase|perfume|cocktail shaker|\bjar\b|pitcher|eggnog|\bjug\b/i],
  ['plastic', /water bottle|pop bottle|soda bottle|plastic bag|water jug|\bpail\b|bucket|soap dispenser|lotion|sunscreen|hair spray|measuring cup|beaker|diaper|shopping basket|\btub\b|pill bottle|\bbottle\b|\bcup\b|\bcrate\b|syringe/i],
  ['paper', /envelope|carton|book jacket|binder|\bnotebook\b|packet|comic book|paper towel|toilet tissue|\bmenu\b|crossword|newspaper|cardboard|jigsaw|\bbook/i],
  ['metal', /can opener|\btin\b|\bpan\b|\bwok\b|frying|caldron|\bpot\b|spatula|ladle|cleaver|hatchet|padlock|\bnail\b|\bscrew|\bhook\b|\bchain\b|safety pin|buckle|\bbolt\b|hammer|wrench|plunger|barrel|strainer|\bsaw\b|\bfork\b|\bspoon\b/i],
  ['organic', /banana|orange|lemon|strawberry|granny smith|\bapple|pineapple|\bfig\b|pomegranate|jackfruit|custard apple|broccoli|cauliflower|cucumber|zucchini|squash|mushroom|bell pepper|\bcorn\b|artichoke|cabbage|acorn|bagel|pretzel|pizza|hotdog|hot dog|cheeseburger|bread|loaf|burrito|guacamole|meat loaf|potpie|omelet|ice cream|dough|spaghetti|carbonara|\bhay\b|daisy|\bear\b/i]
];
function classifyWaste(preds) {
  const score = {};
  preds.forEach(p => {
    let cat = 'other';
    for (const [c, re] of CATS) { if (re.test(p.className)) { cat = c; break; } }
    score[cat] = (score[cat] || 0) + p.probability;
  });
  let best = 'other', bs = -1;
  Object.keys(score).forEach(c => { if (score[c] > bs) { bs = score[c]; best = c; } });
  return best;
}

let model = null, modelPromise = null, lastAI = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function ensureModel() {
  if (model) return Promise.resolve(model);
  if (!modelPromise) {
    modelPromise = loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0')
      .then(() => loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0'))
      .then(() => window.mobilenet.load())
      .then(m => { model = m; return m; })
      .catch(e => { modelPromise = null; throw e; });
  }
  return modelPromise;
}
window.addEventListener('load', () => setTimeout(() => { ensureModel().catch(() => {}); }, 2500));

  if (!lastAI) return;
  const g = GUIDE[lastAI.cat];
  aiResult.innerHTML =
    '<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem"><i class="fa-solid ' + g.icon + '" style="font-size:1.4rem;color:' + g.color + '"></i>' +

function handleImage(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    imagePreview.src = ev.target.result;
    imagePreview.style.display = 'block';
    aiResult.classList.remove('show');
    aiLoading.classList.remove('hidden');
    aiLoading.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + esc(model ? t('aiLoading') : t('aiModel'));
    try {
      const m = await ensureModel();
      aiLoading.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + esc(t('aiLoading'));
      const img = new Image();
      img.src = ev.target.result;
      await new Promise((r, j) => { img.onload = r; img.onerror = j; });
      const preds = await m.classify(img, 5);
      lastAI = { cat: classifyWaste(preds), prob: preds[0].probability, cls: preds[0].className.split(',')[0] };
      renderAI();
    } catch (err) {
      lastAI = null;
      aiResult.innerHTML = '<p style="color:var(--danger)">' + esc(t('aiError')) + '</p>';
      aiResult.classList.add('show');
    } finally {
      aiLoading.classList.add('hidden');
    }
  };
  reader.readAsDataURL(file);
}

    o: [{ ru: 'В обычный бак во дворе', kk: 'Ауладағы кәдімгі контейнерге' }, { ru: 'В пункт приёма опасных отходов', kk: 'Қауіпті қалдықтар қабылдау пунктіне' }, { ru: 'В контейнер для бумаги', kk: 'Қағаз контейнеріне' }], c: 1 },
  { q: { ru: 'Можно ли сдавать на переработку коробку из-под пиццы с жирными пятнами?', kk: 'Майлы дақтары бар пицца қорабын қайта өңдеуге өткізуге бола ма?' },
    o: [{ ru: 'Да, это обычный картон', kk: 'Иә, бұл кәдімгі картон' }, { ru: 'Нет, жирная бумага не перерабатывается', kk: 'Жоқ, майлы қағаз қайта өңделмейді' }, { ru: 'Да, если сложить вдвое', kk: 'Иә, екі бүктесе' }], c: 1 }
];
let qi = 0, qScore = 0, qAns = [];
function renderQuiz() {
  const box = $('quizBox');
  if (qi >= QUIZ.length) {
    const msg = qScore === QUIZ.length ? t('quizGreat') : qScore >= Math.ceil(QUIZ.length * .6) ? t('quizGood') : t('quizLow');
    box.innerHTML = '<p style="font-weight:600;margin-bottom:1rem">' + esc(t('quizResult')) + ': <strong>' + qScore + ' / ' + QUIZ.length + '</strong>. ' + esc(msg) + '</p>' +
      '<button type="button" class="btn" id="quizAgain"><i class="fa-solid fa-rotate-right"></i> ' + esc(t('quizAgain')) + '</button>';
    $('quizAgain').addEventListener('click', () => { qi = 0; qScore = 0; qAns = []; renderQuiz(); });
    return;
  }
  const Q = QUIZ[qi], ans = qAns[qi];
  box.innerHTML = '<p class="muted" style="margin-bottom:.5rem">' + esc(t('quizQ')) + ' ' + (qi + 1) + ' / ' + QUIZ.length + '</p>' +
    '<strong class="quiz-q">' + esc(Q.q[lang]) + '</strong>' +
    Q.o.map((o, i) => {
      let cls = '';
      if (ans !== undefined) { if (i === Q.c) cls = ' correct'; else if (i === ans) cls = ' wrong'; }
      return '<button type="button" class="quiz-option' + cls + '" data-i="' + i + '"' + (ans !== undefined ? ' disabled' : '') + '>' + esc(o[lang]) + '</button>';
    }).join('') +
    (ans !== undefined ? '<button type="button" class="btn btn-secondary" id="quizNext" style="margin-top:.6rem">' + esc(t('quizNext')) + '</button>' : '');
  box.querySelectorAll('.quiz-option').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i; qAns[qi] = i; if (i === Q.c) qScore++; renderQuiz();
  }));
  const nx = $('quizNext');
  if (nx) nx.addEventListener('click', () => { qi++; renderQuiz(); });
}

/* ================= REPORT FORM ================= */
function fillReportSelects() {
  const d = $('reportDistrict'), ty = $('reportType');
  const dv = d.value, tv = ty.value;
  d.innerHTML = '<option value="">' + esc(t('repDistrict')) + '</option>' + Object.keys(DISTRICTS).map(k => '<option value="' + k + '">' + esc(districtLabel(k)) + '</option>').join('');
  ty.innerHTML = '<option value="">' + esc(t('repType')) + '</option>' + ['missing', 'full', 'dirty', 'new', 'other'].map(k => '<option value="' + k + '">' + esc(t('rt_' + k)) + '</option>').join('');
  d.value = dv; ty.value = tv;
}
$('reportForm').addEventListener('submit', e => {
  e.preventDefault();
  try {
    const arr = JSON.parse(store('ecoloc_reports') || '[]');
    arr.push({ d: $('reportDistrict').value, a: $('reportAddress').value, t: $('reportType').value, c: $('reportDesc').value, ts: Date.now() });
    store('ecoloc_reports', JSON.stringify(arr));
  } catch (err) { /* storage unavailable */ }
  const ok = $('reportSuccess');
  ok.textContent = t('repOk'); ok.classList.remove('hidden');
  e.target.reset();
  setTimeout(() => ok.classList.add('hidden'), 5000);
});

/* ================= STATS ================= */
function renderStats() {
  const sortCount = POINTS.filter(p => p.type === 's' || p.type === 'r').length;
  const items = [[POINTS.length, 'stPoints'], [Object.keys(DISTRICTS).length, 'stDistricts'], [TYPE_KEYS.length, 'stTypes'], [sortCount, 'stSorting']];
  $('statsGrid').innerHTML = items.map(x => '<div class="stat-box"><div class="stat-number">' + x[0] + '</div><div class="stat-label">' + esc(t(x[1])) + '</div></div>').join('');
}

/* ================= APPLY LANGUAGE ================= */
function applyLang() {
  htmlEl.lang = lang === 'kk' ? 'kk' : 'ru';
  document.title = 'EcoLoc Алматы';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('langRu').setAttribute('aria-pressed', lang === 'ru');
  $('langKk').setAttribute('aria-pressed', lang === 'kk');
  const gs = $('geoStatus');
  if (gs.dataset.key) gs.textContent = t(gs.dataset.key);
  fillListControls(); fillReportSelects();
  renderLegend(); renderNearest(); renderList(); renderQuiz(); renderStats(); updateCalc(); renderAI();
  if (MAP_MISSING) {
    const mp = $('map');
    mp.style.display = 'flex'; mp.style.alignItems = 'center'; mp.style.justifyContent = 'center';
    mp.style.padding = '1.5rem'; mp.style.textAlign = 'center'; mp.style.background = 'var(--bg)';
    mp.textContent = t('mapMissing');
  } else {
    map.closePopup();
  }
}
function setLang(l) { lang = l; store('ecoloc_lang', l); applyLang(); }
$('langRu').addEventListener('click', () => setLang('ru'));
$('langKk').addEventListener('click', () => setLang('kk'));

applyLang();

/* ================= PWA Service Worker ================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => { console.log('EcoLoc SW registered', reg.scope); })
      .catch(err => { console.warn('EcoLoc SW failed', err); });
  });
}
})();
</script>
</body>
</html>
